openapi: 3.1.0

info:
  title: Supabase Management API — Access Review
  description: |
    Scoped OpenAPI spec for Scrut's access review integration with Supabase.

    ## Use Case
    Scrut integrates with Supabase via the Management API to retrieve user access data
    for compliance access reviews. The workflow is:
    1. Fetch all organizations the authenticated user belongs to.
    2. For each organization, fetch all members (user name, email, role, MFA status).
    3. Flatten into Scrut's access review format:
       - Account Name  → member.user_name
       - Account Identifier → member.email
       - Roles (Rules column) → "<role_name> (<org_name>)" — comma-separated if multi-org
       - MFA Status → member.mfa_enabled

    ## Authentication
    Use a **Personal Access Token (PAT)** — not a project-level API key.
    Generate one at: https://supabase.com/dashboard/account/tokens

    PATs start with `sbp_` and carry the same privileges as the account holder.
    Pass it as a Bearer token in every request:

    ```
    Authorization: Bearer sbp_xxxxxxxxxxxxxxxxxxxxxxxxxxxx
    ```

    **Never expose the PAT client-side. Use it only in server-side/backend contexts.**

  version: "1.0.0"
  contact:
    name: Supabase Management API Docs
    url: https://supabase.com/docs/reference/api/introduction

servers:
  - url: https://api.supabase.com
    description: Supabase Management API (production)

security:
  - BearerAuth: []

tags:
  - name: Organizations
    description: |
      Endpoints for listing Supabase organizations and their members.
      These are the only two endpoints needed for Scrut access reviews.
  - name: Profile
    description: Fetch the authenticated user's profile (useful to verify PAT is valid).

paths:

  # ─────────────────────────────────────────────
  # 1. LIST ALL ORGANIZATIONS
  # ─────────────────────────────────────────────
  /v1/organizations:
    get:
      operationId: listOrganizations
      summary: List all organizations
      description: |
        Returns all Supabase organizations the authenticated PAT user belongs to.

        **Scrut usage:** Call this first to get all organization slugs and names.
        Then loop over results and call `GET /v1/organizations/{slug}/members` for each.

        **Rate limit:** 120 requests/minute (standard).
      tags:
        - Organizations
      security:
        - BearerAuth: []
      responses:
        "200":
          description: List of organizations the authenticated user belongs to.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Organization"
              example:
                - id: "abc123"
                  name: "Acme Corp"
                  slug: "acme-corp"
                  plan: "pro"
                - id: "def456"
                  name: "Acme Engineering"
                  slug: "acme-eng"
                  plan: "free"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─────────────────────────────────────────────
  # 2. GET A SINGLE ORGANIZATION
  # ─────────────────────────────────────────────
  /v1/organizations/{slug}:
    get:
      operationId: getOrganization
      summary: Get an organization
      description: |
        Returns details of a specific organization by its slug.

        **Scrut usage:** Optional. Use to enrich org metadata if needed.
        Not required for the core access review flow.
      tags:
        - Organizations
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgSlug"
      responses:
        "200":
          description: Organization details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Organization"
              example:
                id: "abc123"
                name: "Acme Corp"
                slug: "acme-corp"
                plan: "pro"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Organization not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"

  # ─────────────────────────────────────────────
  # 3. LIST ORGANIZATION MEMBERS  ← CORE ENDPOINT
  # ─────────────────────────────────────────────
  /v1/organizations/{slug}/members:
    get:
      operationId: listOrganizationMembers
      summary: List organization members
      description: |
        Returns all members of a specific organization, including their role
        and MFA status.

        **Scrut usage:** This is the primary data source for access reviews.
        Call once per org returned by `GET /v1/organizations`.

        **Response fields used by Scrut:**
        | Response Field   | Scrut Field          | Notes                        |
        |-----------------|----------------------|------------------------------|
        | `user_name`     | Account Name         | Falls back to email prefix   |
        | `email`         | Account Identifier   | Unique per member            |
        | `role_name`     | Roles (Rules column) | Format: "<role> (<org name>)"|
        | `mfa_enabled`   | MFA Status           | true / false                 |

        **Role values** (as of Management API v1):
        - `Owner` — full control, billing access
        - `Administrator` — can manage members and settings
        - `Developer` — can create/modify projects
        - `Read Only` — read-only access to projects

        **Rate limit:** 120 requests/minute (standard).
      tags:
        - Organizations
      security:
        - BearerAuth: []
      parameters:
        - $ref: "#/components/parameters/OrgSlug"
      responses:
        "200":
          description: List of organization members with role and MFA status.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/OrganizationMember"
              example:
                - user_id: "11111111-1111-1111-1111-111111111111"
                  user_name: "John Doe"
                  email: "john@acme.com"
                  role_name: "Owner"
                  mfa_enabled: true
                - user_id: "22222222-2222-2222-2222-222222222222"
                  user_name: "Jane Smith"
                  email: "jane@acme.com"
                  role_name: "Developer"
                  mfa_enabled: false
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          description: Organization not found.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          $ref: "#/components/responses/RateLimited"
        "500":
          $ref: "#/components/responses/InternalError"

  # ─────────────────────────────────────────────
  # 4. GET AUTHENTICATED USER PROFILE
  # ─────────────────────────────────────────────
  /v1/profile:
    get:
      operationId: getProfile
      summary: Get authenticated user profile
      description: |
        Returns the profile of the user who owns the PAT token.

        **Scrut usage:** Use this during connector setup/auth verification to
        confirm the PAT is valid and to display which account is connected.
      tags:
        - Profile
      security:
        - BearerAuth: []
      responses:
        "200":
          description: Authenticated user's profile.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserProfile"
              example:
                id: "33333333-3333-3333-3333-333333333333"
                username: "divyansh-jain"
                primary_email: "divyansh.jain@refold.ai"
                free_project_limit: 2
        "401":
          $ref: "#/components/responses/Unauthorized"

# ═════════════════════════════════════════════════════
# COMPONENTS
# ═════════════════════════════════════════════════════
components:

  # ─── Security Schemes ─────────────────────────────
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      description: |
        Supabase Personal Access Token (PAT).
        Generate at: https://supabase.com/dashboard/account/tokens
        Format: `sbp_xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx`

  # ─── Reusable Parameters ─────────────────────────
  parameters:
    OrgSlug:
      name: slug
      in: path
      required: true
      description: |
        The organization's unique slug identifier.
        Obtain from `GET /v1/organizations` → `slug` field.
      schema:
        type: string
        pattern: "^[\\w-]+$"
        example: "acme-corp"

  # ─── Schemas ─────────────────────────────────────
  schemas:

    Organization:
      type: object
      description: A Supabase organization.
      required:
        - id
        - name
        - slug
      properties:
        id:
          type: string
          description: Internal organization ID.
          example: "abc123def456"
        name:
          type: string
          description: Human-readable organization name. Maps to Scrut's Organization Context.
          example: "Acme Corp"
        slug:
          type: string
          description: |
            URL-safe unique identifier for the organization.
            Use this as the `{slug}` path parameter for the members endpoint.
          pattern: "^[\\w-]+$"
          example: "acme-corp"
        plan:
          type: string
          description: Billing plan of the organization.
          enum:
            - free
            - pro
            - team
            - enterprise
          example: "pro"

    OrganizationMember:
      type: object
      description: |
        A member of a Supabase organization. This is the primary object
        consumed by Scrut's access review module.
      required:
        - user_id
        - email
        - role_name
      properties:
        user_id:
          type: string
          format: uuid
          description: Unique identifier for the Supabase user.
          example: "11111111-1111-1111-1111-111111111111"
        user_name:
          type: string
          nullable: true
          description: |
            Display name of the user.
            Maps to Scrut's **Account Name** field.
            May be null if the user hasn't set a username — fall back to email prefix.
          example: "John Doe"
        email:
          type: string
          format: email
          description: |
            Email address of the member.
            Maps to Scrut's **Account Identifier** field.
          example: "john@acme.com"
        role_name:
          type: string
          description: |
            The member's role within this organization.
            Maps to Scrut's **Roles** column (formatted as "<role> (<org name>)").

            Possible values:
            - `Owner` — billing + full admin
            - `Administrator` — member/settings management
            - `Developer` — project create/modify
            - `Read Only` — view-only access
          enum:
            - Owner
            - Administrator
            - Developer
            - Read Only
          example: "Developer"
        mfa_enabled:
          type: boolean
          nullable: true
          description: |
            Whether the member has multi-factor authentication enabled.
            Maps to Scrut's **MFA Status** field.
            Null if MFA status is not available for this account type.
          example: true

    UserProfile:
      type: object
      description: Profile of the authenticated PAT user.
      properties:
        id:
          type: string
          format: uuid
          example: "33333333-3333-3333-3333-333333333333"
        username:
          type: string
          example: "divyansh-jain"
        primary_email:
          type: string
          format: email
          example: "divyansh.jain@refold.ai"
        free_project_limit:
          type: integer
          example: 2

    ErrorResponse:
      type: object
      description: Standard error response from the Supabase Management API.
      properties:
        message:
          type: string
          description: Human-readable error message.
          example: "Unauthorized"
        hint:
          type: string
          nullable: true
          description: Additional context or resolution hint.
          example: "Check that your PAT is valid and not expired."

  # ─── Reusable Responses ─────────────────────────
  responses:

    Unauthorized:
      description: |
        Invalid or missing Bearer token.
        Check that your PAT starts with `sbp_` and has not been revoked.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: "Unauthorized"
            hint: "Ensure your Authorization header contains a valid PAT: Bearer sbp_..."

    Forbidden:
      description: |
        The PAT is valid but lacks permission for this action.
        The PAT user must be a member of the target organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: "Forbidden action"

    RateLimited:
      description: |
        Rate limit exceeded. Standard limit is 120 requests/minute.
        Check `X-RateLimit-Reset` header for seconds until reset.
        Implement exponential backoff before retrying.
      headers:
        X-RateLimit-Limit:
          schema:
            type: integer
          description: Max requests allowed in the current window.
        X-RateLimit-Remaining:
          schema:
            type: integer
          description: Requests remaining before hitting the limit.
        X-RateLimit-Reset:
          schema:
            type: integer
          description: Seconds until the rate limit window resets.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: "Rate limit exceeded"

    InternalError:
      description: Unexpected server error. Retry with exponential backoff.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
          example:
            message: "Unexpected error"
