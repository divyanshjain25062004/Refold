openapi: 3.0.3
info:
  title: Paperless Parts API
  description: >
    The Paperless Parts REST API enables developers to integrate with the
    Paperless Parts manufacturing quoting platform. Common use cases include
    syncing sent quotes and placed orders into ERP systems, managing CRM
    data (accounts, contacts, facilities), and building managed integrations
    that respond to platform events.


    ## Authentication

    All requests require an API token passed in the `Authorization` header
    using the format `API-Token <your-token>`. Generate, revoke, or
    re-generate your token from **Settings > Integrations > API Token**
    in the Paperless Parts UI.


    ## Rate Limiting

    The API enforces a rate limit of **100 requests per minute**. Exceeding
    this limit returns HTTP `429 Too Many Requests` with a `Retry-After`
    header indicating the wait time in seconds.


    ## Money Fields

    Numeric fields representing monetary values are returned as numbers
    rounded to 2 decimal places, except for `piece_price` on purchased
    components which is returned with 4 decimal places.


    ## Metadata

    Several objects support a `metadata` property — a key-value object that
    can store up to 25 keys, with key names up to 40 characters and values
    up to 500 characters.


    ## Python SDK

    An official Python SDK is available at
    [github.com/part-os/core-python](https://github.com/part-os/core-python).
  version: "2.0"
  contact:
    name: Paperless Parts Support
    url: https://help.paperlessparts.com
    email: support@paperlessparts.com
  license:
    name: Proprietary
    url: https://www.paperlessparts.com/privacy-policy/
  termsOfService: https://www.paperlessparts.com/privacy-policy/

servers:
  - url: https://api.paperlessparts.com
    description: Production API server

security:
  - ApiTokenAuth: []

tags:
  - name: Quotes
    description: >
      Create, retrieve, and manage quotes. Quotes are the core entity of the
      Paperless Parts platform — each contains line items, pricing, customer
      info, and status tracking.
  - name: Quote Items
    description: >
      Manage individual line items within a quote. Each quote item represents
      a part or assembly being quoted.
  - name: Quote Operations
    description: >
      Manage manufacturing operations on quote items (e.g., CNC Milling,
      Turning, Anodize).
  - name: Quote Add-Ons
    description: Manage add-on charges associated with quote items.
  - name: Quote Discounts
    description: Create and manage discounts applied to quotes.
  - name: Quote Pricing Items
    description: >
      Manage pricing items and their quantity-based price breaks within
      quote items.
  - name: Quote Files
    description: Upload and retrieve files attached to quotes.
  - name: Orders
    description: >
      Retrieve placed orders and order details. Orders are created when a
      customer places an order from a sent quote.
  - name: Accounts
    description: >
      Manage company accounts in the Paperless Parts CRM. An account
      represents a single company to which you send quotes.
  - name: Contacts
    description: >
      Manage contacts (individuals) within accounts. Each contact is
      uniquely identified by their email address.
  - name: Billing Addresses
    description: Manage billing addresses associated with accounts.
  - name: Facilities
    description: Manage facilities (shipping destinations) for accounts.
  - name: Purchased Components
    description: Manage purchased components and their custom property columns.
  - name: Custom Tables
    description: Create and manage user-defined lookup tables for pricing logic.
  - name: Events
    description: >
      Retrieve platform events for managed integrations (e.g.,
      order.created, quote.sent).
  - name: Integration Actions
    description: Create and update integration action log records.
  - name: Integration Heartbeat
    description: Report integration health status.

paths:
  # ════════════════════════════════════════════════
  #  QUOTES — Core
  # ════════════════════════════════════════════════
  /quotes/public:
    post:
      operationId: createQuote
      summary: Create a new quote
      description: >
        Creates a new quote object in draft status. All parameters are
        optional. Associate a customer by providing contact_id. Assign
        team members via the estimator and salesperson UUID fields.
      tags:
        - Quotes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteCreate"
      responses:
        "201":
          description: Quote created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /quotes/public/new:
    get:
      operationId: listNewQuotes
      summary: List newly sent quotes
      description: >
        Returns a list of newly sent quotes. Optionally provide a quote
        number and revision to retrieve only quotes sent after that
        specific quote, enabling incremental polling.
      tags:
        - Quotes
      parameters:
        - name: number
          in: query
          description: >
            Quote number after which to start returning results.
          required: false
          schema:
            type: integer
            example: 37
        - name: revision
          in: query
          description: >
            Revision number used with number to define starting point.
          required: false
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: A list of newly sent quotes.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Quote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /quotes/public/header/{quoteUuid}:
    get:
      operationId: getQuoteHeader
      summary: Get a quote header by UUID
      description: >
        Returns high-level header information for a quote identified by
        its UUID, without full nested line-item details.
      tags:
        - Quotes
      parameters:
        - name: quoteUuid
          in: path
          description: The UUID of the quote.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Quote header details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /quotes/public/{quoteNumber}:
    get:
      operationId: getQuote
      summary: Get a quote by number
      description: >
        Returns full details of a specific quote including quote_items
        (as UUIDs), pricing, contact info, status, metadata, and
        timestamps. Optionally specify a revision.
      tags:
        - Quotes
      parameters:
        - name: quoteNumber
          in: path
          description: The quote number.
          required: true
          schema:
            type: integer
            example: 37
        - name: revision
          in: query
          description: >
            Specific revision. If omitted, latest revision is returned.
          required: false
          schema:
            type: integer
            example: 1
      responses:
        "200":
          description: Full quote details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /quotes/public/{quoteNumber}/status_change:
    patch:
      operationId: updateQuoteStatus
      summary: Change a quote's status
      description: >
        Updates the status of an existing quote. Settable statuses
        include outstanding, cancelled, trash, and lost.
      tags:
        - Quotes
      parameters:
        - name: quoteNumber
          in: path
          description: The quote number.
          required: true
          schema:
            type: integer
            example: 1090
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - outstanding
                    - cancelled
                    - trash
                    - lost
                  example: outstanding
      responses:
        "200":
          description: Quote status updated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ════════════════════════════════════════════════
  #  QUOTES — Items
  # ════════════════════════════════════════════════
  /quotes/public/items:
    post:
      operationId: createQuoteItem
      summary: Create a quote item
      description: Creates a new line item (part) within a quote.
      tags:
        - Quote Items
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteItemCreate"
      responses:
        "201":
          description: Quote item created successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /quotes/public/items/{quoteItemUuid}:
    get:
      operationId: getQuoteItem
      summary: Get a quote item by UUID
      description: >
        Returns full details of a single quote item including part
        information, quantities, components, and operations.
      tags:
        - Quote Items
      parameters:
        - name: quoteItemUuid
          in: path
          description: The UUID of the quote item.
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Quote item details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    patch:
      operationId: updateQuoteItem
      summary: Update a quote item
      description: Updates an existing quote item. Only provided fields change.
      tags:
        - Quote Items
      parameters:
        - name: quoteItemUuid
          in: path
          description: The UUID of the quote item.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/QuoteItemUpdate"
      responses:
        "200":
          description: Quote item updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /quotes/public/items/{quoteItemUuid}/bulk_update_operations:
    patch:
      operationId: bulkUpdateQuoteItemOperations
      summary: Bulk update operations on a quote item
      description: >
        Updates multiple operations on a quote item in a single request.
      tags:
        - Quote Items
      parameters:
        - name: quoteItemUuid
          in: path
          description: The UUID of the quote item.
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                operations:
                  type: array
                  items:
                    $ref: "#/components/schemas/OperationBulkUpdate"
      responses:
        "200":
          description: Operations updated successfully.
          content:
            application/json:
              schema:
                type: object
                properties:
                  operations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ════════════════════════════════════════════════
  #  QUOTES — Operations
  # ════════════════════════════════════════════════
  /quotes/public/operations:
    post:
      operationId: createOperation
      summary: Create an operation
      description: Creates a new manufacturing operation on a quote item.
      tags:
        - Quote Operations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationCreate"
      responses:
        "201":
          description: Operation created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /quotes/public/operations/{operationUuid}:
    get:
      operationId: getOperation
      summary: Get an operation by UUID
      tags:
        - Quote Operations
      parameters:
        - name: operationUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Operation details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    patch:
      operationId: updateOperation
      summary: Update an operation
      tags:
        - Quote Operations
      parameters:
        - name: operationUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/OperationUpdate"
      responses:
        "200":
          description: Operation updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operation"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      operationId: deleteOperation
      summary: Delete an operation
      tags:
        - Quote Operations
      parameters:
        - name: operationUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ════════════════════════════════════════════════
  #  QUOTES — Add-Ons
  # ════════════════════════════════════════════════
  /quotes/public/add_ons/{addOnUuid}:
    get:
      operationId: getAddOn
      summary: Get an add-on by UUID
      tags:
        - Quote Add-Ons
      parameters:
        - name: addOnUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Add-on details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddOn"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    patch:
      operationId: updateAddOn
      summary: Update an add-on
      tags:
        - Quote Add-Ons
      parameters:
        - name: addOnUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddOnUpdate"
      responses:
        "200":
          description: Add-on updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AddOn"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      operationId: deleteAddOn
      summary: Delete an add-on
      tags:
        - Quote Add-Ons
      parameters:
        - name: addOnUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ════════════════════════════════════════════════
  #  QUOTES — Discounts
  # ════════════════════════════════════════════════
  /quotes/public/discounts:
    post:
      operationId: createDiscount
      summary: Create a discount
      tags:
        - Quote Discounts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountCreate"
      responses:
        "201":
          description: Discount created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /quotes/public/discounts/{discountUuid}:
    get:
      operationId: getDiscount
      summary: Get a discount by UUID
      tags:
        - Quote Discounts
      parameters:
        - name: discountUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Discount details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discount"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    patch:
      operationId: updateDiscount
      summary: Update a discount
      tags:
        - Quote Discounts
      parameters:
        - name: discountUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiscountUpdate"
      responses:
        "200":
          description: Discount updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Discount"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    delete:
      operationId: deleteDiscount
      summary: Delete a discount
      tags:
        - Quote Discounts
      parameters:
        - name: discountUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Deleted.
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ════════════════════════════════════════════════
  #  QUOTES — Pricing Items
  # ════════════════════════════════════════════════
  /quotes/public/pricing_items/{pricingItemUuid}:
    get:
      operationId: getPricingItem
      summary: Get a pricing item by UUID
      tags:
        - Quote Pricing Items
      parameters:
        - name: pricingItemUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pricing item details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingItem"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    patch:
      operationId: updatePricingItem
      summary: Update a pricing item
      tags:
        - Quote Pricing Items
      parameters:
        - name: pricingItemUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingItemUpdate"
      responses:
        "200":
          description: Pricing item updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingItem"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /quotes/public/pricing_item_quantities/{uuid}:
    get:
      operationId: getPricingItemQuantity
      summary: Get a pricing item quantity by UUID
      tags:
        - Quote Pricing Items
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Pricing item quantity details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingItemQuantity"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    patch:
      operationId: updatePricingItemQuantity
      summary: Update a pricing item quantity
      tags:
        - Quote Pricing Items
      parameters:
        - name: uuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PricingItemQuantityUpdate"
      responses:
        "200":
          description: Pricing item quantity updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PricingItemQuantity"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  # ════════════════════════════════════════════════
  #  QUOTES — Files
  # ════════════════════════════════════════════════
  /quotes/public/{quoteUuid}/files:
    post:
      operationId: uploadQuoteFile
      summary: Upload a file to a quote
      tags:
        - Quote Files
      parameters:
        - name: quoteUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        "201":
          description: File uploaded.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/QuoteFile"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

    get:
      operationId: listQuoteFiles
      summary: List files attached to a quote
      tags:
        - Quote Files
      parameters:
        - name: quoteUuid
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: A list of files.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/QuoteFile"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
        "429":
          $ref: "#/components/responses/TooManyRequests"

  /quotes/public/{quoteUuid}/files/{fileUuid}:
    get:
      operationId: getQuoteFile
      summary: Get a specific file from a quote
      tags:
        - Quote Files
      parameters:
        - name: quoteUuid
