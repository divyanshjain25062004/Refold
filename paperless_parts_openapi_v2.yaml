    IntegrationActionCreate:
      type: object
      required: [status, integration_action_definition_id]
      properties:
        status:
          type: string
          enum: [queued, in_progress, completed, failed, cancelled, timed_out]
        status_message:
          type: string
          nullable: true
        integration_action_definition_id:
          type: integer
        related_object_type:
          type: string
          nullable: true
        related_object_id:
          type: integer
          nullable: true

    IntegrationActionUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [queued, in_progress, completed, failed, cancelled, timed_out]
        status_message:
          type: string
          nullable: true
