# ════════════════════════════════════════════════════════
#  COMPONENTS
# ════════════════════════════════════════════════════════
components:
  securitySchemes:
    ApiTokenAuth:
      type: apiKey
      in: header
      name: Authorization
      description: >
        Pass your token as API-Token <your-token> in the Authorization
        header. Generate from Settings > Integrations > API Token.

  parameters:
    PageParam:
      name: page
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSizeParam:
      name: page_size
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20

  responses:
    BadRequest:
      description: Invalid request body or parameters.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    Unauthorized:
      description: Missing, invalid, or revoked API token.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"
    TooManyRequests:
      description: Rate limit exceeded (100 req/min).
      headers:
        Retry-After:
          description: Seconds to wait before retrying.
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Error"

  schemas:
    Error:
      type: object
      properties:
        error:
          type: string
        detail:
          type: string
          nullable: true

    Address:
      type: object
      properties:
        address1:
          type: string
          example: 137 Portland St.
        address2:
          type: string
          nullable: true
        city:
          type: string
          example: Boston
        state:
          type: string
          example: MA
        country:
          type: string
          example: USA
        postal_code:
          type: string
          example: "02114"
      required: [address1, city, state, country, postal_code]

    Metadata:
      type: object
      description: >
        Key-value metadata. Up to 25 keys (40 char max), values 500 char max.
      additionalProperties:
        type: string
        maxLength: 500
      example:
        crm_id: "1581"

    Salesperson:
      type: object
      properties:
        email:
          type: string
          format: email

    # ─── Quotes ───────────────────────────────────
    Quote:
      type: object
      description: >
        A manufacturing quote. quote_items contains UUIDs of QuoteItem
        objects retrieved via the Quote Items endpoints.
      properties:
        number:
          type: integer
          description: >
            Quote number. With revision_number, forms the unique ID.
          readOnly: true
          example: 37
        revision_number:
          type: integer
          nullable: true
          readOnly: true
          example: 1
        status:
          type: string
          enum:
            - draft
            - outstanding
            - expired
            - cancelled
            - partially_accepted
            - accepted
            - trash
            - lost
        contact_id:
          type: integer
          nullable: true
          example: 1581
        estimator:
          type: string
          format: uuid
          nullable: true
          description: UUID of the estimator assigned to this quote.
          example: 335c5770-8cd4-46d3-98a1-7c0e12251124
        salesperson:
          type: string
          format: uuid
          nullable: true
          description: UUID of the salesperson assigned to this quote.
          example: 335c5770-8cd4-46d3-98a1-7c0e12251124
        quote_items:
          type: array
          description: Array of QuoteItem UUIDs.
          readOnly: true
          items:
            type: string
            format: uuid
          example:
            - 335c5770-8cd4-46d3-98a1-7c0e12251124
            - 414277a8-4144-49f6-9bc9-1bdcbc9f0749
        created:
          type: string
          format: date-time
          readOnly: true
