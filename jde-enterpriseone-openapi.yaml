openapi: 3.0.3
info:
  title: Oracle JD Edwards EnterpriseOne REST API
  description: |
    OpenAPI 3.0 specification for Oracle JD Edwards EnterpriseOne 9.2.
    Covers two API surfaces:
    - **AIS (Application Interface Services) Server** – Authentication, Form Service,
      Data/Table Query, Batch Form, App Stack, Business Function, Media Object,
      Orchestrator, Watchlist, Jargon, Report, Preference, Processing Options,
      Task Authorization, Notification, Message, Logging, and Config endpoints.
    - **Server Manager** – Authentication, Instance management, monitoring, log control,
      cache management, and provisioning endpoints.

    ### Base URLs
    - AIS Server: `http://{ais-host}:{ais-port}/jderest`
    - Server Manager: `https://{smc-host}:{smc-port}/manage/mgmtrestservice`

    ### Authentication
    AIS endpoints support multiple authentication methods:
    1. **Token-based**: Obtain a session token via `/tokenrequest` (POST) passing
       `username`/`password` in the JSON body. Include the token in subsequent
       requests via the `token` body field or the `jde-AIS-Auth` header.
    2. **HTTP Basic Auth**: Pass credentials in the `Authorization: Basic` header
       (username/password can be omitted from body when using Basic Auth).
    3. **JWT / OAuth 2.0**: Pass a JWT in the `Authorization: Bearer` header
       (requires OAM/trusted node configuration).
    4. **psToken**: Pass a PeopleSoft token in the `psToken` body field.

    Server Manager endpoints use HTTP Basic Authentication.

  version: "9.2"
  contact:
    name: Oracle JD Edwards Documentation
    url: https://docs.oracle.com/en/applications/jd-edwards/cross-product/9.2/

servers:
  - url: http://{aisHost}:{aisPort}/jderest
    description: AIS Server
    variables:
      aisHost:
        default: localhost
        description: AIS Server hostname
      aisPort:
        default: "8080"
        description: AIS Server port
  - url: https://{smcHost}:{smcPort}/manage/mgmtrestservice
    description: Server Manager Console
    variables:
      smcHost:
        default: jdesmc.example.com
        description: Server Manager Console hostname
      smcPort:
        default: "8999"
        description: Server Manager Console port (default 8999)

tags:
  - name: AIS Authentication
    description: Token-based session management for AIS Server
  - name: AIS Form Service
    description: Execute EnterpriseOne interactive application forms
  - name: AIS Batch Form Service
    description: Execute multiple form requests in a single call
  - name: AIS App Stack Service
    description: Stateful form session management
  - name: AIS Data Service
    description: Query EnterpriseOne tables and business views
  - name: AIS Business Function Service
    description: Execute EnterpriseOne Business Functions (BSFNs)
  - name: AIS Orchestrator Service
    description: Execute orchestrations
  - name: AIS Media Object Service
    description: Manage media object attachments (file upload/download, text, URL)
  - name: AIS Watchlist Service
    description: Execute EnterpriseOne watchlists
  - name: AIS Jargon Service
    description: Fetch jargon and language-specific translations
  - name: AIS Report Service
    description: Execute and monitor EnterpriseOne reports (batch jobs)
  - name: AIS Processing Option Service
    description: Retrieve processing option values for applications
  - name: AIS Preference Service
    description: Manage user preference records (F98950)
  - name: AIS Task Authorization Service
    description: Retrieve authorized task/menu information
  - name: AIS Notification Service
    description: Manage and execute notifications
  - name: AIS Message Service
    description: Send EnterpriseOne messages (PPAT) to email or work center
  - name: AIS Logging Service
    description: Write entries to the AIS server log
  - name: AIS Config Service
    description: Retrieve AIS server configuration
  - name: AIS External Service
    description: Invoke external REST/FTP services via soft coding
  - name: AIS Utilities Service
    description: Utility services (object list queries, etc.)
  - name: AIS OpenAPI Catalog
    description: Retrieve OpenAPI / Swagger definitions for orchestrations
  - name: AIS Orchestration Discovery
    description: Discover available orchestrations
  - name: AIS Scheduler Service
    description: Manage scheduled notifications and orchestrations
  - name: AIS UDO Service
    description: Retrieve user defined object (UDO) details
  - name: Server Manager Authentication
    description: Authenticate to Server Manager Console
  - name: Server Manager Instances
    description: Manage JDE server instances
  - name: Server Manager Monitoring
    description: Monitor instance health, connections, and processes
  - name: Server Manager Logging
    description: Control log levels and retrieve log data
  - name: Server Manager Cache
    description: Manage database and table caches

# ─────────────────────────────────────────────────────────────
# SECURITY SCHEMES
# ─────────────────────────────────────────────────────────────
components:
  securitySchemes:
    AISTokenAuth:
      type: apiKey
      in: header
      name: jde-AIS-Auth
      description: |
        Session token obtained from /tokenrequest. Pass either in the
        request body as the `token` field, or as the `jde-AIS-Auth` header.
    AISBasicAuth:
      type: http
      scheme: basic
      description: |
        HTTP Basic Auth for AIS endpoints. Credentials (username:password)
        are base64-encoded in the Authorization header.
    AISBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        JWT / OAuth 2.0 Bearer token. Requires OAM or trusted node
        configuration on the HTML Server.
    BasicAuth:
      type: http
      scheme: basic
      description: HTTP Basic Auth used by Server Manager endpoints

  # ─────────────────────────────────────────────────────────────
  # REUSABLE SCHEMAS
  # ─────────────────────────────────────────────────────────────
  schemas:

    # ── AIS Auth ──────────────────────────────────────────────
    TokenRequest:
      type: object
      description: |
        Token request body. Authentication can be provided via:
        - `username` + `password` in body
        - HTTP Basic Auth header (omit username/password from body)
        - JWT Bearer header (omit username/password from body)
        - `psToken` field (PeopleSoft token)
        The `deviceName` field is optional; if omitted, the requesting
        IP address is used as the device identifier.
      properties:
        username:
          type: string
          description: JD Edwards EnterpriseOne username (required if not using Basic Auth, JWT, or psToken)
          example: JDE
        password:
          type: string
          format: password
          description: JD Edwards EnterpriseOne password (required if not using Basic Auth, JWT, or psToken)
          example: JDE
        deviceName:
          type: string
          description: Identifier for the calling device or application. If not provided, the requesting IP address is used.
          example: MyDevice
        environment:
          type: string
          description: JDE environment to use for login. If not specified, the AIS Server default is used.
          example: JDV920
        role:
          type: string
          description: JDE role to use for login. If not specified, the AIS Server default is used.
          example: "*ALL"
        jasserver:
          type: string
          description: HTML (JAS) Server to use for login. If not specified, the AIS Server default is used.
        psToken:
          type: string
          description: PeopleSoft token for psToken-based authentication.
        requiredCapabilities:
          type: array
          items:
            type: string
          description: List of required AIS capabilities the client needs.
          example: []

    TokenResponse:
      type: object
      properties:
        username:
          type: string
          example: JDE
        environment:
          type: string
          example: JDV920
        role:
          type: string
          example: "*ALL"
        jasserver:
          type: string
          description: JAS server that issued the token
        userInfo:
          $ref: '#/components/schemas/UserInfo'
        userAuthorized:
          type: boolean
          description: Whether the user is authorized for AIS access
        adminAuthorized:
          type: boolean
          description: Whether the user has admin privileges
        aisSessionCookie:
          type: string
          description: AIS session cookie value
        version:
          type: string
          nullable: true
        poStringJSON:
          type: string
          nullable: true
        altPoStringJSON:
          type: string
          nullable: true
        deprecated:
          type: boolean
          description: Indicates if the v1 endpoint is deprecated (true for v1 responses)

    UserInfo:
      type: object
      properties:
        token:
          type: string
          description: Session token — include in all subsequent AIS requests
          example: "044abcdef1234567890..."
        username:
          type: string
        addressNumber:
          type: integer
        alphaName:
          type: string
          description: Alpha name from Address Book
        appsRelease:
          type: string
          description: Applications release (e.g. E920)
          example: E920
        langPref:
          type: string
          description: Language preference code
        locale:
          type: string
          example: en
        dateFormat:
          type: string
          description: Date format preference (e.g. MDY, DMY)
          example: MDY
        dateSeperator:
          type: string
          description: Date separator character
          example: "/"
        simpleDateFormat:
          type: string
          example: "MM/dd/yy"
        decimalFormat:
          type: string
          description: Decimal separator character
          example: "."
        country:
          type: string

    LogoutRequest:
      type: object
      properties:
        token:
          type: string
          description: The AIS token to invalidate

    ValidateTokenRequest:
      type: object
      properties:
        token:
          type: string
          description: The AIS token to validate
        touch:
          type: boolean
          description: Touch the user session to extend the session timeout
        deviceName:
          type: string
        environment:
          type: string

    # ── AIS Common ────────────────────────────────────────────
    AISBaseRequest:
      type: object
      description: |
        Base request fields common to most AIS service calls. The `token`
        field is required unless using Basic Auth, JWT, or psToken
        authentication headers.
      properties:
        token:
          type: string
          description: Session token from /tokenrequest
        environment:
          type: string
          example: JDV920
        role:
          type: string
          example: "*ALL"
        jasserver:
          type: string
          description: Target JAS server (optional)
        deviceName:
          type: string
        returnControlIDs:
          type: string
          description: Pipe-separated or comma-separated list of control IDs to return
          example: "1[0]|2[0]|3[0]"
        outputType:
          type: string
          description: Controls the output format (e.g. VERSION2, GRID_DATA)

    FormServiceControl:
      type: object
      properties:
        id:
          type: string
          description: Control/field ID on the JDE form
          example: "14"
        value:
          type: string
          example: "1001"
        specialRowHandle:
          type: string

    FormServiceAction:
      type: object
      properties:
        controlID:
          type: string
        command:
          type: string
          enum:
            - SetQBEValue
            - SetControlValue
            - DoAction
            - SelectRow
            - SelectAllRows
            - DeselectRow
            - InsertGridRow
            - EditGridRow
            - UpdateRow
            - DeleteGridRow
            - GridCellClick
            - SetGridCellValue
            - SetGridComboValue
            - SetCheckboxValue
          description: |
            Form action command. Common commands:
            - SetQBEValue: Set a Query By Example value
            - SetControlValue: Set a form control value
            - DoAction: Press a button or trigger an event
            - SelectRow / SelectAllRows / DeselectRow: Grid row selection
            - InsertGridRow / EditGridRow / UpdateRow / DeleteGridRow: Grid CRUD
          example: SetQBEValue
        value:
          type: string

    FormServiceRequest:
      allOf:
        - $ref: '#/components/schemas/AISBaseRequest'
        - type: object
          required: [formName]
          properties:
            formName:
              type: string
              description: |
                JDE form name. Can be specified as:
                - Short form: `W0101A` (with separate version field)
                - Full form: `P0101_W0101A_ZJDE0001`
              example: P0101_W0101A
            version:
              type: string
              description: Processing option version
              example: ZJDE0001
            formInputs:
              type: array
              items:
                $ref: '#/components/schemas/FormServiceControl'
            formActions:
              type: array
              items:
                $ref: '#/components/schemas/FormServiceAction'
            formServiceAction:
              type: string
              description: Form service action type (R=Read, U=Update, etc.)
              enum: [R, U, A, D]
            findOnEntry:
              type: boolean
              default: true
            maxPageSize:
              type: string
              description: Max number of grid rows to return
              example: "100"
            stopOnWarning:
              type: boolean
              default: false
            formServiceDemo:
              type: boolean
              default: false
              description: When true, returns form metadata including control IDs without executing actions
            aliasNaming:
              type: boolean
              description: Use alias naming in output instead of control IDs
            returnDescriptions:
              type: boolean
              description: Include field descriptions in output

    FormServiceResponse:
      type: object
      properties:
        currentApp:
          type: string
        title:
          type: string
        data:
          type: object
          properties:
            gridData:
              $ref: '#/components/schemas/GridData'
            txtMessage:
              type: string
          additionalProperties: true
        stackId:
          type: integer
        stateId:
          type: integer
        rid:
          type: string
        sysErrors:
          type: array
          items:
            $ref: '#/components/schemas/JDEError'

    GridData:
      type: object
      properties:
        id:
          type: integer
        gridRecords:
          type: array
          items:
            type: object
            additionalProperties: true
        summary:
          type: object
          properties:
            records:
              type: integer
            moreRecords:
              type: boolean
        columns:
          type: object
          additionalProperties: true

    JDEError:
      type: object
      properties:
        code:
          type: string
        desc:
          type: string
        errorOrigin:
          type: string
        mobile:
          type: string

    # ── Batch Form Service ────────────────────────────────────
    BatchFormRequest:
      type: object
      properties:
        token:
          type: string
        environment:
          type: string
        role:
          type: string
        deviceName:
          type: string
        requests:
          type: array
          items:
            $ref: '#/components/schemas/FormServiceRequest'

    BatchFormResponse:
      type: object
      properties:
        responses:
          type: array
          items:
            $ref: '#/components/schemas/FormServiceResponse'

    # ── App Stack (Stateful) ──────────────────────────────────
    AppStackRequest:
      allOf:
        - $ref: '#/components/schemas/FormServiceRequest'
        - type: object
          properties:
            stackId:
              type: integer
              description: Stack ID from previous response (for subsequent calls)
            stateId:
              type: integer
              description: State ID from previous response
            rid:
              type: string

    NextRecordRequest:
      allOf:
        - $ref: '#/components/schemas/AISBaseRequest'
        - type: object
          properties:
            stackId:
              type: integer
            stateId:
              type: integer
            rid:
              type: string
            maxPageSize:
              type: string

    # ── Data Service ──────────────────────────────────────────
    TableQueryRequest:
      allOf:
        - $ref: '#/components/schemas/AISBaseRequest'
        - type: object
          required: [targetName, targetType]
          properties:
            targetName:
              type: string
              description: Table or view name (e.g. F0101)
              example: F0101
            targetType:
              type: string
              enum: [table, view]
              example: table
            query:
              $ref: '#/components/schemas/QueryCondition'
            aggregation:
              $ref: '#/components/schemas/Aggregation'
            maxPageSize:
              type: string
              example: "500"
            returnControlIDs:
              type: string
              description: Comma-separated column aliases to return
              example: "AN8,ALPH,AT1"
            findOnEntry:
              type: boolean
              default: true

    QueryCondition:
      type: object
      properties:
        autoFind:
          type: boolean
          default: true
        matchType:
          type: string
          enum: [MATCH_ALL, MATCH_ANY]
          default: MATCH_ALL
          description: Whether all conditions must match (AND) or any (OR)
        condition:
          type: array
          items:
            $ref: '#/components/schemas/Condition'

    Condition:
      type: object
      properties:
        controlId:
          type: string
          description: Column alias (e.g. AN8, DOCO)
        operator:
          type: string
          enum:
            - EQUAL
            - NOT_EQUAL
            - GREATER
            - GREATER_EQUAL
            - LESS
            - LESS_EQUAL
            - STR_START_WITH
            - STR_END_WITH
            - STR_CONTAIN
            - STR_NOT_BLANK
            - STR_BLANK
            - LIST
            - BETWEEN
            - BLANK
            - NOT_BLANK
          example: EQUAL
        value:
          type: array
          items:
            type: object
            properties:
              content:
                type: string
              specialValueId:
                type: string
                enum: [LITERAL, CURRENT_DATE, CURRENT_USER, ZERO_DATE, BLANK]
                default: LITERAL

    Aggregation:
      type: object
      properties:
        orderBy:
          type: array
          items:
            type: object
            properties:
              column:
                type: string
              direction:
                type: string
                enum: [ASC, DESC]
        groupBy:
          type: array
          items:
            type: object
            properties:
              column:
                type: string
        aggregates:
          type: array
          items:
            type: object
            properties:
              column:
                type: string
              aggregation:
                type: string
                enum: [SUM, COUNT, AVG, MIN, MAX]

    DataServiceResponse:
      type: object
      properties:
        fs_DATABROWSE:
          type: object
          properties:
            title:
              type: string
            data:
              type: object
              properties:
                gridData:
                  $ref: '#/components/schemas/GridData'

    # ── Business Function Service ─────────────────────────────
    BSFNDiscoverRequest:
      allOf:
        - $ref: '#/components/schemas/AISBaseRequest'
        - type: object
          required: [objectName]
          properties:
            objectName:
              type: string
              description: Business function object name (e.g. B0000130)
              example: B0000130
            returnDetail:
              type: boolean
              default: false

    BSFNExecuteRequest:
      allOf:
        - $ref: '#/components/schemas/AISBaseRequest'
        - type: object
          required: [bsfnName]
          properties:
            bsfnName:
              type: string
              description: Business function name
            bsfnInput:
              type: object
              additionalProperties: true
              description: Input parameter key-value pairs

    # ── Orchestrator ──────────────────────────────────────────
    OrchestrationRequest:
      type: object
      properties:
        token:
          type: string
        deviceName:
          type: string
        environment:
          type: string
        role:
          type: string
        inputs:
          type: object
          additionalProperties: true
          description: Orchestration input parameters

    # ── Media Object Service ──────────────────────────────────
    FileListRequest:
      allOf:
        - $ref: '#/components/schemas/AISBaseRequest'
        - type: object
          required: [moStructure, moKey]
          properties:
            moStructure:
              type: string
              description: Media object structure name
            moKey:
              type: array
              items:
                type: string
              description: Media object key values

    # ── Watchlist ─────────────────────────────────────────────
    WatchlistRequest:
      allOf:
        - $ref: '#/components/schemas/AISBaseRequest'
        - type: object
          required: [watchlistName]
          properties:
            watchlistName:
              type: string
              description: Name of the watchlist to execute

    # ── Jargon Service ────────────────────────────────────────
    JargonRequest:
      allOf:
        - $ref: '#/components/schemas/AISBaseRequest'
        - type: object
          properties:
            ddItems:
              type: array
              items:
                type: string
              description: List of Data Dictionary items to retrieve jargon for

    # ── Report Service ────────────────────────────────────────
    ReportExecuteRequest:
      allOf:
        - $ref: '#/components/schemas/AISBaseRequest'
        - type: object
          required: [reportName]
          properties:
            reportName:
              type: string
              description: UBE report name
            reportVersion:
              type: string
              description: Report version
            reportOutputType:
              type: string
              enum: [PDF, CSV, XML]

    ReportStatusRequest:
      allOf:
        - $ref: '#/components/schemas/AISBaseRequest'
        - type: object
          required: [jobNumber]
          properties:
            jobNumber:
              type: string
              description: Job number to check status for

    # ── Processing Option Service ─────────────────────────────
    POServiceRequest:
      allOf:
        - $ref: '#/components/schemas/AISBaseRequest'
        - type: object
          required: [applicationName, version]
          properties:
            applicationName:
              type: string
              description: Application name (e.g. P0101)
            version:
              type: string
              description: Version name (e.g. ZJDE0001)

    # ── Config ────────────────────────────────────────────────
    ConfigResponse:
      type: object
      properties:
        jasServer:
          type: string
        aisVersion:
          type: string
        environment:
          type: string
        capabilities:
          type: array
          items:
            type: string
        capabilityList:
          type: array
          items:
            type: string
        aisSessionTimeout:
          type: integer
        jasMultipleBaseURLs:
          type: array
          items:
            type: string

    # ── Server Manager ────────────────────────────────────────
    SMAuthRequest:
      type: object
      required: [username, password]
      properties:
        username:
          type: string
          example: jde_admin
        password:
          type: string
          format: password

    InstanceInfo:
      type: object
      properties:
        instanceName:
          type: string
          example: tqa_923_lnx_jas
        instanceType:
          type: string
          enum: [JAS, AIS, ENT, SM, ORCH, ADF]
        agentHostName:
          type: string
        jdeHome:
          type: string
        status:
          type: string
          enum: [RUNNING, STOPPED, UNKNOWN, STARTING, STOPPING]
        port:
          type: integer

    InstanceStateRequest:
      type: object
      required: [instanceName, agentHostName, jdeHome]
      properties:
        instanceName:
          type: string
        agentHostName:
          type: string
        jdeHome:
          type: string

    LogLevelRequest:
      type: object
      required: [instanceName, agentHostName, jdeHome, loggingLevel, logName]
      properties:
        instanceName:
          type: string
        agentHostName:
          type: string
        jdeHome:
          type: string
        loggingLevel:
          type: string
          enum: [APP, DEBUG, WARN, ERROR, FATAL]
          example: APP
        logName:
          type: string
          example: E1LOG

    CacheClearRequest:
      type: object
      required: [instanceName, agentHostName, jdeHome, jdbjDatabaseCacheName]
      properties:
        instanceName:
          type: string
        agentHostName:
          type: string
        jdeHome:
          type: string
        jdbjDatabaseCacheName:
          type: string
          description: Cache name or ALL to clear all caches
          example: ALL

    GCRequest:
      type: object
      required: [instanceName, agentHostName, jdeHome]
      properties:
        instanceName:
          type: string
        agentHostName:
          type: string
        jdeHome:
          type: string

    ManagedHomeInfo:
      type: object
      properties:
        managedHomeName:
          type: string
        agentHostName:
          type: string
        status:
          type: string
        requiresUpdate:
          type: boolean

    AgentInfo:
      type: object
      properties:
        agentHostName:
          type: string
        agentPort:
          type: integer
        agentStatus:
          type: string
        agentVersion:
          type: string

    StandardError:
      type: object
      properties:
        message:
          type: string
        errorCode:
          type: integer
        details:
          type: string

# ─────────────────────────────────────────────────────────────
# PATHS
# ─────────────────────────────────────────────────────────────
paths:

  # ════════════════════════════════════════════════════════════
  # AIS — AUTHENTICATION (Token Request Service)
  # ════════════════════════════════════════════════════════════

  /tokenrequest:
    post:
      tags: [AIS Authentication]
      summary: Request a session token (v1)
      description: |
        Authenticates an EnterpriseOne user and returns a session token.
        The token must be included in all subsequent AIS requests via the
        `token` body field or `jde-AIS-Auth` header. Supports username/password
        in body, HTTP Basic Auth, JWT Bearer, or psToken authentication.
        **Note**: The v1 endpoint is deprecated; use `/v2/tokenrequest` instead.
      operationId: requestTokenV1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
            example:
              username: JDE
              password: JDE
              deviceName: MyDevice
              environment: JDV920
              role: "*ALL"
      responses:
        '200':
          description: Token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /v2/tokenrequest:
    get:
      tags: [AIS Authentication]
      summary: Request a session token via GET (v2)
      description: |
        v2 token request via GET — credentials must be supplied via HTTP Basic
        Auth or JWT Bearer header. Environment, role, and device can be specified
        via `jde-AIS-Auth-Env`, `jde-AIS-Auth-Role`, and `jde-AIS-Auth-Device` headers.
      operationId: requestTokenV2Get
      parameters:
        - name: jde-AIS-Auth-Env
          in: header
          schema:
            type: string
          description: Environment to use for login
        - name: jde-AIS-Auth-Role
          in: header
          schema:
            type: string
          description: Role to use for login
        - name: jde-AIS-Auth-Device
          in: header
          schema:
            type: string
          description: Device name identifier
      security:
        - AISBasicAuth: []
        - AISBearerAuth: []
      responses:
        '200':
          description: Token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
    post:
      tags: [AIS Authentication]
      summary: Request a session token (v2)
      description: |
        v2 token request — adds extended capability negotiation. Supports all
        authentication methods (body credentials, Basic Auth, JWT, psToken).
      operationId: requestTokenV2Post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TokenRequest'
      responses:
        '200':
          description: Token issued successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '401':
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /tokenrequest/logout:
    post:
      tags: [AIS Authentication]
      summary: End a session (v1)
      description: Invalidates the session token and ends the AIS session.
      operationId: logoutV1
      security:
        - AISTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Session ended successfully
        '401':
          description: Invalid or expired token

  /v2/tokenrequest/logout:
    post:
      tags: [AIS Authentication]
      summary: End a session (v2)
      description: Invalidates the session token and ends the AIS session (v2).
      operationId: logoutV2
      security:
        - AISTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
      responses:
        '200':
          description: Session ended successfully

  /v2/tokenrequest/validate:
    post:
      tags: [AIS Authentication]
      summary: Validate a session token (v2)
      description: |
        Validates that the provided AIS token is still active. Returns HTTP 200
        if valid; any other status code indicates an invalid token. Optionally
        touch the session to extend the timeout.
      operationId: validateTokenV2
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ValidateTokenRequest'
            example:
              token: "044RCAgER+J6ZDUAZgotcr4..."
      responses:
        '200':
          description: Token is valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  isValidSession:
                    type: boolean
                  timeout:
                    type: integer
        '401':
          description: Token is invalid or expired

  # ════════════════════════════════════════════════════════════
  # AIS — FORM SERVICE
  # ════════════════════════════════════════════════════════════

  /formservice:
    post:
      tags: [AIS Form Service]
      summary: Execute a form (v1)
      description: |
        Opens an EnterpriseOne application form, optionally performs actions
        (QBE, grid operations, button clicks), and returns form data.
      operationId: executeFormV1
      security:
        - AISTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormServiceRequest'
            example:
              token: "abcdef1234567890"
              environment: JDV920
              formName: P0101_W0101A
              findOnEntry: true
              maxPageSize: "100"
              formInputs:
                - id: "6"
                  value: "1001"
              returnControlIDs: "1[0]|2[0]"
      responses:
        '200':
          description: Form executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormServiceResponse'
        '401':
          description: Unauthorized
        '500':
          description: JDE application error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StandardError'

  /v2/formservice:
    post:
      tags: [AIS Form Service]
      summary: Execute a form (v2)
      description: v2 form service — supports additional events and enhanced grid operations.
      operationId: executeFormV2
      security:
        - AISTokenAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FormServiceRequest'
      responses:
        '200':
          description: Form executed successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormServiceResponse'
        '401':
          description: Unauthorized

  /v2/formservice/{application}/{form}:
    get:
      tags: [AIS Form Service]
      summary: Simple form service query (v2)
      description: |
        Simplified form query via GET — opens the specified form and performs
        a find, returning grid data. Uses the default version.
      operationId: simpleFormQueryV2
      security:
        - AISTokenAuth: []
        - AISBasicAuth: []
      parameters:
        - name: application
          in: path
          required: true
          schema:
            type: string
          description: Application ID (e.g. P0101)
          example: P0101
        - name: form
          in: path
          required: true
          schema:
            type: string
          description: Form ID (e.g. W0101A)
          example: W0101A
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormServiceResponse'

  /v2/formservice/{application}/{form}/{version}:
    get:
      tags: [AIS Form Service]
      summary: Simple form service query with version (v2)
      description: |
        Simplified form query via GET with explicit processing option version.
      operationId: simpleFormQueryWithVersionV2
      security:
        - AISTokenAuth: []
        - AISBasicAuth: []
      parameters:
        - name: application
          in: path
          required: true
          schema:
            type: string
          example: P0101
        - name: form
          in: path
          required: true
          schema:
            type: string
          example: W0101A
        - name: version
          in: path
          required: true
          schema:
            type: string
          example: ZJDE0001
      responses:
        '200':
          description: Query successful
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FormServiceResponse'

