              targetType: table
              returnControlIDs: "AN8,ALPH,AT1,TAXC"
              maxPageSize: "100"
              query:
                autoFind: true
                condition:
                  - controlId: AT1
                    operator: EQUAL
                    value:
                      - content: "C"
